<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vis</title>
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
<audio class="audio" src="audio/Formation.mp3" controls type="audio/mpeg">
    Your browser does not support the audio element.
</audio>
<div class="background"></div>
<div class="smoke"></div>
<div class="track-title"></div>
<div class="visualizer-container"></div>

<div class="sequencer">
    <div class="sequencer-header">
        <button class="seq-play-btn">▶ Play Beat</button>
        <label class="seq-tempo">
            BPM <input type="range" min="60" max="180" value="120" class="seq-tempo-slider">
            <span class="seq-tempo-value">120</span>
        </label>
    </div>
    <div class="sequencer-grid"></div>
</div>

<script>
    (function () {
        // Spiral layout settings
        const NBR_OF_BARS = 60;
        const ANGLE_STEP_DEG = 17;     // degrees between bars — higher = tighter spiral
        const RADIUS_BASE = 20;        // px, distance of first bar from center
        const RADIUS_GROWTH = 3.5;     // px added per degree of rotation
        const BAR_WIDTH = 2;           // px
        const BAR_MAX_LENGTH = 70;     // px, full length at max amplitude

        const audio = document.querySelector("audio");
        const ctx = new AudioContext();
        const audioSource = ctx.createMediaElementSource(audio);
        const analyzer = ctx.createAnalyser();
        analyzer.fftSize = 2048;
        // ---- Shared reverb bus (add once, near your analyzer setup) ----
function createReverbImpulse(duration = 1.8, decay = 2.5) {
    const rate = ctx.sampleRate;
    const length = rate * duration;
    const impulse = ctx.createBuffer(2, length, rate);
    for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, decay);
        }
    }
    return impulse;
}
const reverb = ctx.createConvolver();
reverb.buffer = createReverbImpulse();
const reverbGain = ctx.createGain();
reverbGain.gain.value = 0.22;
reverb.connect(reverbGain);
reverbGain.connect(analyzer);
reverbGain.connect(ctx.destination);
        audioSource.connect(analyzer);
        audioSource.connect(ctx.destination);
        const frequencyData = new Uint8Array(analyzer.frequencyBinCount);

        const visualizerContainer = document.querySelector(".visualizer-container");
        const bars = [];

        for (let i = 0; i < NBR_OF_BARS; i++) {
            const angleDeg = i * ANGLE_STEP_DEG;
            const angleRad = angleDeg * Math.PI / 180;
            const radius = RADIUS_BASE + RADIUS_GROWTH * angleDeg / 10;

            const x = radius * Math.cos(angleRad);
            const y = radius * Math.sin(angleRad);

            const bar = document.createElement("div");
            bar.className = "visualizer-container__bar";
            bar.style.left = x + "px";
            bar.style.top = (y - BAR_MAX_LENGTH) + "px";
            bar.style.width = BAR_WIDTH + "px";
            bar.style.height = BAR_MAX_LENGTH + "px";
            // rotate to point outward, then scale length via renderFrame
            bar.dataset.angle = angleDeg + 90;

            visualizerContainer.appendChild(bar);
            bars.push(bar);
        }

        function renderFrame() {
            analyzer.getByteFrequencyData(frequencyData);
            for (let i = 0; i < NBR_OF_BARS; i++) {
                // spread across the lower/mid spectrum, where most visible energy lives
                const index = Math.floor((i / NBR_OF_BARS) * 300);
                const fd = frequencyData[index] || 0;
                const scale = Math.max(0.15, fd / 255); // 0.15 min so quiet bars stay visible
                const angle = bars[i].dataset.angle;
                bars[i].style.transform = `rotate(${angle}deg) scaleY(${scale})`;
            }
            window.requestAnimationFrame(renderFrame);
        }
        renderFrame();

        audio.volume = 0.10;

        audio.addEventListener("play", () => {
            if (ctx.state === "suspended") {
                ctx.resume();
            }
        });




        ///////
        // ---- Step sequencer ----
const SEQ_ROWS = [
    { label: "Hi",   type: "melodic", freq: 880, waveform: "triangle" },
    { label: "Mid",  type: "melodic", freq: 440, waveform: "sine" },
    { label: "Low",  type: "melodic", freq: 220, waveform: "sawtooth" },
    { label: "Kick", type: "kick" }
];
const NBR_OF_STEPS = 16;

// ---- Replace your old playNote with this ----
function playNote(freq, waveform, duration = 0.35) {
    const now = ctx.currentTime;

    const noteGain = ctx.createGain();
    noteGain.gain.setValueAtTime(0.0001, now);
    noteGain.gain.linearRampToValueAtTime(0.22, now + 0.04);   // soft attack, no click
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

    const filter = ctx.createBiquadFilter();
    filter.type = "lowpass";
    filter.frequency.value = freq * 5;
    filter.Q.value = 0.6;

    // subtle vibrato for a more "alive", less synthetic pitch
    const vibrato = ctx.createOscillator();
    const vibratoGain = ctx.createGain();
    vibrato.frequency.value = 5;
    vibratoGain.gain.value = 3;
    vibrato.connect(vibratoGain);

    noteGain.connect(filter);
    filter.connect(analyzer);
    filter.connect(ctx.destination);
    filter.connect(reverb);

    // two slightly detuned oscillators = warmth instead of a flat single tone
    [-5, 5].forEach(detune => {
        const osc = ctx.createOscillator();
        osc.type = waveform;
        osc.frequency.value = freq;
        osc.detune.value = detune;
        vibratoGain.connect(osc.detune);
        osc.connect(noteGain);
        osc.start(now);
        osc.stop(now + duration + 0.1);
    });
    vibrato.start(now);
    vibrato.stop(now + duration + 0.1);
}

function playKick() {
    const now = ctx.currentTime;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = "sine";
    osc.frequency.setValueAtTime(150, now);
    osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
    gain.gain.setValueAtTime(0.6, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
    osc.connect(gain);
    gain.connect(analyzer);
    gain.connect(ctx.destination);
    osc.start(now);
    osc.stop(now + 0.25);
}

const seqGrid = document.querySelector(".sequencer-grid");
SEQ_ROWS.forEach((row, rowIndex) => {
    const rowEl = document.createElement("div");
    rowEl.className = "seq-row";

    const labelEl = document.createElement("div");
    labelEl.className = "seq-row-label";
    labelEl.textContent = row.label;
    rowEl.appendChild(labelEl);

    for (let step = 0; step < NBR_OF_STEPS; step++) {
        const stepEl = document.createElement("button");
        stepEl.className = "seq-step";
        stepEl.dataset.row = rowIndex;
        stepEl.dataset.step = step;
        stepEl.addEventListener("click", () => stepEl.classList.toggle("active"));
        rowEl.appendChild(stepEl);
    }
    seqGrid.appendChild(rowEl);
});

const playBtn = document.querySelector(".seq-play-btn");
const tempoSlider = document.querySelector(".seq-tempo-slider");
const tempoValueLabel = document.querySelector(".seq-tempo-value");

let currentStep = 0;
let seqInterval = null;
let isSeqPlaying = false;

function stepIntervalMs() {
    const bpm = parseInt(tempoSlider.value, 10);
    return (60000 / bpm) / 4; // 16th notes
}

function advanceStep() {
    document.querySelectorAll(".seq-step.current").forEach(el => el.classList.remove("current"));
    SEQ_ROWS.forEach((row, rowIndex) => {
        const stepEl = document.querySelector(`.seq-step[data-row="${rowIndex}"][data-step="${currentStep}"]`);
        if (!stepEl) return;
        stepEl.classList.add("current");
        if (stepEl.classList.contains("active")) {
            row.type === "kick" ? playKick() : playNote(row.freq, row.waveform);
        }
    });
    currentStep = (currentStep + 1) % NBR_OF_STEPS;
}

function startSequencer() {
    if (ctx.state === "suspended") ctx.resume();
    isSeqPlaying = true;
    playBtn.textContent = "■ Stop";
    currentStep = 0;
    seqInterval = setInterval(advanceStep, stepIntervalMs());
}

function stopSequencer() {
    isSeqPlaying = false;
    playBtn.textContent = "▶ Play Beat";
    clearInterval(seqInterval);
    document.querySelectorAll(".seq-step.current").forEach(el => el.classList.remove("current"));
}

playBtn.addEventListener("click", () => isSeqPlaying ? stopSequencer() : startSequencer());

tempoSlider.addEventListener("input", () => {
    tempoValueLabel.textContent = tempoSlider.value;
    if (isSeqPlaying) {
        clearInterval(seqInterval);
        seqInterval = setInterval(advanceStep, stepIntervalMs());
    }
});



    })();
</script>
</body>
